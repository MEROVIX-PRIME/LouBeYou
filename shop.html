<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lou Be You — Shop</title>
<meta name="description" content="Shop the full Lou Be You collection — cozy illustrated apparel, mugs, and more. Free shipping on orders over 500,000₫.">
<link rel="icon" href="assets/img/lou-logo.webp">
<link rel="canonical" href="https://loubeyou.shop/shop.html">
<meta property="og:type" content="website">
<meta property="og:url" content="https://loubeyou.shop/shop.html">
<meta property="og:title" content="Lou Be You — Shop">
<meta property="og:description" content="Shop the full Lou Be You collection — cozy illustrated apparel, mugs, and more.">
<meta property="og:image" content="https://loubeyou.shop/assets/img/lou-logo.webp">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Gaegu:wght@400;700&family=Pangolin&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="shop">

<div data-header></div>

<div class="page-head">
  <div class="wrap">
    <nav class="breadcrumbs breadcrumbs-shop" aria-label="Breadcrumb" data-breadcrumbs>
      <a href="index.html" data-i18n="breadcrumb.home">Home</a><span>›</span><span data-i18n="breadcrumb.shop">Shop</span>
    </nav>
    <h1 class="page-title" data-i18n="shop.title">Shop</h1>
    <p class="page-sub" data-i18n="shop.subtitle">Everything Lou brings to your day.</p>
  </div>
</div>

<!-- Баннеры категорий -->
<section class="wrap category-banners" data-banners style="display:none"></section>

<main class="wrap" style="padding-bottom:60px">
  <div class="filter-panel filter-panel--row" data-filter-panel>
    <!-- Динамические фильтры вставляются скриптом -->
    <label><span data-i18n="filter.sort">Sort</span><select class="select" data-sort></select></label>
    <button class="btn filter-reset" data-reset data-i18n="filter.reset">Clear filters</button>
  </div>
  <span class="count" data-count></span>
  <div class="products" data-grid></div>
  <div class="show-more-wrap" data-show-more-wrap style="display:none">
    <button class="btn btn-outline show-more-btn" data-show-more data-i18n="shop.showMore">Show more</button>
  </div>
</main>

<div data-footer></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function () {
  var PAGE_SIZE = 8;
  var params = new URLSearchParams(location.search);
  var FILTERS_DATA = window.LOU_FILTERS || {};

  /* Текущая категория из URL: ?cat=clothes&sub=t-shirts&sub2=adults */
  var state = {
    cat: params.get("cat") || "",
    sub: params.get("sub") || "",
    sub2: params.get("sub2") || "",
    sort: "new",
    shown: PAGE_SIZE
    /* Динамические фильтры добавляются при buildFilterControls */
  };

  var filterPanel = document.querySelector("[data-filter-panel]");
  var sortLabel = filterPanel.querySelector("[data-sort]").parentNode;
  var dynamicLabels = [];  /* DOM-элементы динамических фильтров */
  var dynamicKeys = [];    /* ключи фильтров в state */

  function option(value, label) { return '<option value="' + value + '">' + label + '</option>'; }

  /* ---- Определяем текущую конфигурацию фильтров ---- */
  function getCurrentFilterConfig() {
    /* Приоритет: самая конкретная категория → менее конкретная → parent */
    if (state.sub2 && FILTERS_DATA[state.sub2]) return FILTERS_DATA[state.sub2];
    if (state.sub && FILTERS_DATA[state.sub]) return FILTERS_DATA[state.sub];
    if (state.cat && FILTERS_DATA[state.cat]) return FILTERS_DATA[state.cat];
    if (FILTERS_DATA["parent"]) return FILTERS_DATA["parent"];
    /* Fallback — дефолтный набор */
    return [
      { key: "collection", en: "Collection", ru: "Коллекция", vi: "Bộ sưu tập" },
      { key: "color", en: "Color", ru: "Цвет", vi: "Màu sắc" },
      { key: "price", en: "Price", ru: "Цена", vi: "Giá" }
    ];
  }

  /* ---- Построение DOM фильтров ---- */
  function buildFilterControls() {
    /* Удаляем предыдущие динамические фильтры */
    dynamicLabels.forEach(function (el) { el.remove(); });
    dynamicLabels = [];
    dynamicKeys.forEach(function (key) { delete state[key]; });
    dynamicKeys = [];

    var config = getCurrentFilterConfig();

    for (var i = 0; i < config.length; i++) {
      var f = config[i];

      if (f.key === "price") {
        /* ---- Ползунок цены в выпадающем блоке ---- */
        var outer = document.createElement("label");
        outer.className = "price-filter-label";
        var spanP = document.createElement("span");
        spanP.textContent = LOU.pick(f);
        outer.appendChild(spanP);

        var dd = document.createElement("div");
        dd.className = "price-dd";
        var ddHead = document.createElement("div");
        ddHead.className = "price-dd-head select";
        var ddText = document.createElement("span");
        ddText.className = "price-dd-text";
        ddText.textContent = LOU.t("filter.all");
        ddHead.appendChild(ddText);
        var ddArrow = document.createElement("span");
        ddArrow.className = "price-dd-arrow";
        ddArrow.innerHTML = "&#9662;";
        ddHead.appendChild(ddArrow);
        dd.appendChild(ddHead);

        var ddBody = document.createElement("div");
        ddBody.className = "price-dd-body";

        var track = document.createElement("div");
        track.className = "price-slider-track";
        var fill = document.createElement("div");
        fill.className = "price-slider-fill";
        track.appendChild(fill);

        var inputMin = document.createElement("input");
        inputMin.type = "range"; inputMin.className = "price-range price-range--min";
        inputMin.min = 0; inputMin.max = 100; inputMin.value = 0;
        var inputMax = document.createElement("input");
        inputMax.type = "range"; inputMax.className = "price-range price-range--max";
        inputMax.min = 0; inputMax.max = 100; inputMax.value = 100;
        track.appendChild(inputMin);
        track.appendChild(inputMax);
        ddBody.appendChild(track);

        var vals = document.createElement("div");
        vals.className = "price-slider-vals";
        var valMin = document.createElement("span");
        valMin.className = "price-val-min";
        var valMax = document.createElement("span");
        valMax.className = "price-val-max";
        vals.appendChild(valMin);
        vals.appendChild(valMax);
        ddBody.appendChild(vals);
        dd.appendChild(ddBody);
        outer.appendChild(dd);

        /* Открытие / закрытие */
        ddHead.addEventListener("click", function (e) {
          e.preventDefault(); e.stopPropagation();
          var open = dd.classList.toggle("open");
          if (open) {
            /* Закроем при клике снаружи */
            setTimeout(function () {
              document.addEventListener("click", closePrice);
            }, 0);
          }
        });
        function closePrice(e) {
          if (!dd.contains(e.target)) {
            dd.classList.remove("open");
            document.removeEventListener("click", closePrice);
          }
        }
        /* Не закрывать при клике внутри body */
        ddBody.addEventListener("click", function (e) { e.stopPropagation(); });

        filterPanel.insertBefore(outer, sortLabel);
        dynamicLabels.push(outer);
        dynamicKeys.push("price");
        state.price = "all";
        state._priceMin = 0;
        state._priceMax = Infinity;
        state._priceSliderMin = inputMin;
        state._priceSliderMax = inputMax;
        state._priceFill = fill;
        state._priceValMin = valMin;
        state._priceValMax = valMax;
        state._priceDdText = ddText;

        (function (inMin, inMax) {
          function upd() {
            var lo = Number(inMin.value), hi = Number(inMax.value);
            if (lo > hi) { var t = lo; lo = hi; hi = t; inMin.value = lo; inMax.value = hi; }
            state._priceMin = lo;
            state._priceMax = hi;
            state.price = "range";
            updateSliderFill();
            updateSliderLabels();
            state.shown = PAGE_SIZE;
            render();
          }
          inMin.addEventListener("input", upd);
          inMax.addEventListener("input", upd);
        })(inputMin, inputMax);

        continue;
      }

      var label = document.createElement("label");
      var span = document.createElement("span");
      span.textContent = LOU.pick(f);
      var select = document.createElement("select");
      select.className = "select";
      select.dataset.filterKey = f.key;
      label.appendChild(span);
      label.appendChild(select);

      /* Вставляем перед Sort */
      filterPanel.insertBefore(label, sortLabel);
      dynamicLabels.push(label);
      dynamicKeys.push(f.key);
      state[f.key] = "all";

      /* Событие */
      (function (key) {
        select.addEventListener("change", function () {
          state[key] = this.value;
          state.shown = PAGE_SIZE;
          render();
        });
      })(f.key);
    }
  }

  /* ---- Ценовой ползунок: вспомогательные функции ---- */
  function priceMoney(vnd) {
    var cfg = window.LOU_CONFIG || {};
    var lang = LOU.getLang();
    if (lang === "en") return "$" + Math.round(vnd / (cfg.usdToVnd || 26000));
    if (lang === "ru") return Math.round(vnd / (cfg.usdToVnd || 26000) * (cfg.usdToRub || 85)) + " ₽";
    return Math.round(vnd).toLocaleString("vi-VN") + " ₫";
  }

  function updateSliderFill() {
    if (!state._priceFill || !state._priceSliderMin) return;
    var min = Number(state._priceSliderMin.min);
    var max = Number(state._priceSliderMin.max);
    var range = max - min || 1;
    var lo = (Number(state._priceSliderMin.value) - min) / range * 100;
    var hi = (Number(state._priceSliderMax.value) - min) / range * 100;
    state._priceFill.style.left = lo + "%";
    state._priceFill.style.width = (hi - lo) + "%";
  }

  function updateSliderLabels() {
    if (!state._priceValMin) return;
    var lo = priceMoney(state._priceMin);
    var hi = priceMoney(state._priceMax);
    state._priceValMin.textContent = lo;
    state._priceValMax.textContent = hi;
    /* Текст в свёрнутом виде */
    if (state._priceDdText) {
      if (state.price === "all") {
        state._priceDdText.textContent = LOU.t("filter.all");
      } else {
        state._priceDdText.textContent = lo + " — " + hi;
      }
    }
  }

  /* ---- Хлебные крошки с категориями ---- */
  function renderBreadcrumbs() {
    var bc = document.querySelector("[data-breadcrumbs]");
    if (!bc) return;
    var tree = window.LOU_CATEGORY_TREE || {};
    var html = '<a href="index.html" data-i18n="breadcrumb.home">' + LOU.t("breadcrumb.home") + '</a><span>›</span>';

    if (!state.cat) {
      html += '<span data-i18n="breadcrumb.shop">' + LOU.t("breadcrumb.shop") + '</span>';
    } else {
      html += '<a href="shop.html">' + LOU.t("breadcrumb.shop") + '</a><span>›</span>';
      var catNode = tree[state.cat];
      var catName = catNode ? LOU.pick(catNode.name) : state.cat;

      if (!state.sub) {
        html += '<span>' + catName + '</span>';
      } else {
        html += '<a href="shop.html?cat=' + encodeURIComponent(state.cat) + '">' + catName + '</a><span>›</span>';
        var subNode = catNode && catNode.children ? catNode.children[state.sub] : null;
        var subName = subNode ? LOU.pick(subNode.name) : state.sub;

        if (!state.sub2) {
          html += '<span>' + subName + '</span>';
        } else {
          html += '<a href="shop.html?cat=' + encodeURIComponent(state.cat) + '&sub=' + encodeURIComponent(state.sub) + '">' + subName + '</a><span>›</span>';
          var sub2Node = subNode && subNode.children ? subNode.children[state.sub2] : null;
          var sub2Name = sub2Node ? LOU.pick(sub2Node.name) : state.sub2;
          html += '<span>' + sub2Name + '</span>';
        }
      }
    }
    bc.innerHTML = html;
  }

  /* ---- Баннеры категорий ---- */
  function renderBanners() {
    var host = document.querySelector("[data-banners]");
    if (!host) return;
    var tree = window.LOU_CATEGORY_TREE || {};
    var items = [];

    if (!state.cat) {
      for (var slug in tree) {
        var c = tree[slug];
        items.push({ slug: slug, name: LOU.pick(c.name), image: c.image, href: 'shop.html?cat=' + encodeURIComponent(slug) });
      }
    } else if (!state.sub) {
      var catNode = tree[state.cat];
      if (catNode && catNode.children) {
        for (var slug in catNode.children) {
          var s = catNode.children[slug];
          items.push({ slug: slug, name: LOU.pick(s.name), image: s.image, href: 'shop.html?cat=' + encodeURIComponent(state.cat) + '&sub=' + encodeURIComponent(slug) });
        }
      }
    } else if (!state.sub2) {
      var catNode2 = tree[state.cat];
      var subNode = catNode2 && catNode2.children ? catNode2.children[state.sub] : null;
      if (subNode && subNode.children) {
        for (var slug in subNode.children) {
          var s2 = subNode.children[slug];
          items.push({ slug: slug, name: LOU.pick(s2.name), image: s2.image, href: 'shop.html?cat=' + encodeURIComponent(state.cat) + '&sub=' + encodeURIComponent(state.sub) + '&sub2=' + encodeURIComponent(slug) });
        }
      }
    }

    if (!items.length) {
      host.style.display = 'none';
      return;
    }

    host.style.display = '';
    host.innerHTML = '<div class="banners-grid">' + items.map(function(it) {
      var img = it.image || 'assets/img/lou-logo.webp';
      return '<a class="cat-banner" href="' + it.href + '">' +
        '<div class="cat-banner__img"><img src="' + img + '" alt="' + it.name + '" loading="lazy"></div>' +
        '<span class="cat-banner__name">' + it.name + '</span>' +
      '</a>';
    }).join('') + '</div>';
  }

  /* ---- Товары текущей категории (до фильтров) ---- */
  function getCategoryProducts() {
    return LOU.products.filter(function (p) {
      if (state.cat && p.category !== state.cat) return false;
      if (state.sub && p.subcategory !== state.sub) return false;
      if (state.sub2 && p.subcategory2 !== state.sub2) return false;
      return true;
    });
  }

  /* ---- Сбор доступных значений для фильтра ---- */
  function getFilterValues(key, catProducts) {
    var tree = window.LOU_CATEGORY_TREE || {};
    var sizeOrder = ["XS","S","M","L","XL","XXL","2XL","3XL"];
    var vals = [];

    switch (key) {
      case "collection":
        var collSet = {};
        catProducts.forEach(function (p) { if (p.collection) collSet[p.collection] = true; });
        var avail = LOU.collections.filter(function (c) { return collSet[c.id]; });
        vals = avail.map(function (c) { return { value: c.id, label: LOU.pick(c) }; });
        break;

      case "size":
        var sizeSet = {};
        catProducts.forEach(function (p) {
          if (p.sizes) p.sizes.forEach(function (s) { sizeSet[s] = true; });
        });
        vals = Object.keys(sizeSet).sort(function (a, b) {
          var ia = sizeOrder.indexOf(a), ib = sizeOrder.indexOf(b);
          return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
        }).map(function (s) { return { value: s, label: s }; });
        break;

      case "color":
        var colorSet = {};
        catProducts.forEach(function (p) {
          if (p.colors) p.colors.forEach(function (c) { colorSet[c] = true; });
        });
        vals = Object.keys(colorSet).map(function (c) {
          return { value: c, label: LOU.colorLabel(c) };
        });
        break;

      case "price":
        vals = [
          { value: "low", label: LOU.t("filter.priceLow") },
          { value: "mid", label: LOU.t("filter.priceMid") },
          { value: "high", label: LOU.t("filter.priceHigh") }
        ];
        break;

      case "product_type":
        /* Подкатегории внутри текущей родительской категории */
        var typeSet = {};
        catProducts.forEach(function (p) { if (p.subcategory) typeSet[p.subcategory] = true; });
        Object.keys(typeSet).forEach(function (sub) {
          var label = sub;
          if (state.cat && tree[state.cat] && tree[state.cat].children && tree[state.cat].children[sub]) {
            label = LOU.pick(tree[state.cat].children[sub].name);
          }
          vals.push({ value: sub, label: label });
        });
        break;

      case "for_whom":
        /* Подкатегории 2 уровня */
        var whomSet = {};
        catProducts.forEach(function (p) { if (p.subcategory2) whomSet[p.subcategory2] = true; });
        Object.keys(whomSet).forEach(function (sub2) {
          var label = sub2;
          if (state.cat && tree[state.cat] && tree[state.cat].children) {
            var subNode = tree[state.cat].children[state.sub];
            if (subNode && subNode.children && subNode.children[sub2]) {
              label = LOU.pick(subNode.children[sub2].name);
            }
          }
          vals.push({ value: sub2, label: label });
        });
        break;

      default:
        /* Неизвестный фильтр — пробуем найти поле в товарах */
        var customSet = {};
        catProducts.forEach(function (p) {
          var v = p[key];
          if (v) {
            if (Array.isArray(v)) v.forEach(function (x) { customSet[x] = true; });
            else customSet[v] = true;
          }
        });
        vals = Object.keys(customSet).map(function (v) { return { value: v, label: v }; });
        break;
    }
    return vals;
  }

  /* ---- Проверка товара на соответствие фильтру ---- */
  function matchesFilter(p, key, value) {
    if (value === "all") return true;

    switch (key) {
      case "collection":
        return p.collection === value;
      case "size":
        return (p.sizes || []).indexOf(value) !== -1;
      case "color":
        return (p.colors || []).indexOf(value) !== -1;
      case "price":
        if (value === "all") return true;
        return p.price >= state._priceMin && p.price <= state._priceMax;
      case "product_type":
        return p.subcategory === value;
      case "for_whom":
        return p.subcategory2 === value;
      default:
        var pv = p[key];
        if (Array.isArray(pv)) return pv.indexOf(value) !== -1;
        return pv === value;
    }
  }

  /* ---- Заполнение опций динамических фильтров ---- */
  function renderFilters() {
    var catProducts = getCategoryProducts();
    var config = getCurrentFilterConfig();

    dynamicKeys.forEach(function (key, idx) {
      var el = dynamicLabels[idx];
      var filterDef = config[idx];

      if (key === "price") {
        /* Ценовой ползунок — обновляем диапазон */
        /* Обновляем заголовок (при смене языка) */
        var labelSpan = el.querySelector("span");
        if (labelSpan && filterDef) labelSpan.textContent = LOU.pick(filterDef);

        var prices = catProducts.map(function (p) { return p.price; }).filter(function (v) { return v > 0; });
        if (!prices.length) { el.style.display = "none"; return; }
        el.style.display = "";

        var minP = Math.min.apply(null, prices);
        var maxP = Math.max.apply(null, prices);
        var step = maxP > 1000000 ? 50000 : maxP > 100000 ? 10000 : 1000;
        if (minP === maxP) maxP = minP + step;

        var inMin = state._priceSliderMin;
        var inMax = state._priceSliderMax;
        inMin.min = minP; inMin.max = maxP; inMin.step = step;
        inMax.min = minP; inMax.max = maxP; inMax.step = step;

        /* Если цена «all» (сброс) — ставим концы */
        if (state.price === "all") {
          inMin.value = minP; inMax.value = maxP;
          state._priceMin = minP; state._priceMax = maxP;
        }
        updateSliderFill();
        updateSliderLabels();
        return;
      }

      var select = el.querySelector("select");
      /* Обновляем заголовок фильтра (при смене языка) */
      el.querySelector("span").textContent = filterDef ? LOU.pick(filterDef) : key;

      var vals = getFilterValues(key, catProducts);

      select.innerHTML = option("all", LOU.t("filter.all")) + vals.map(function (v) {
        return option(v.value, v.label);
      }).join("");

      /* Скрываем если значений <= 1 */
      el.style.display = vals.length <= 1 ? "none" : "";

      /* Восстанавливаем выбранное значение */
      select.value = state[key] || "all";
    });

    /* Сортировка — всегда одинаковая */
    var sortSelect = document.querySelector("[data-sort]");
    sortSelect.innerHTML = option("new", LOU.t("shop.sort.new")) + option("asc", LOU.t("shop.sort.priceAsc")) + option("desc", LOU.t("shop.sort.priceDesc"));
    sortSelect.value = state.sort;
  }

  /* ---- Фильтрация товаров ---- */
  function getFilteredItems() {
    return LOU.products.filter(function (p) {
      if (state.cat && p.category !== state.cat) return false;
      if (state.sub && p.subcategory !== state.sub) return false;
      if (state.sub2 && p.subcategory2 !== state.sub2) return false;

      for (var i = 0; i < dynamicKeys.length; i++) {
        var key = dynamicKeys[i];
        if (!matchesFilter(p, key, state[key])) return false;
      }
      return true;
    });
  }

  /* ---- Рендер ---- */
  function render() {
    renderFilters();
    renderBreadcrumbs();
    renderBanners();

    var items = getFilteredItems();
    if (state.sort === "asc") items.sort(function (a, b) { return a.price - b.price; });
    if (state.sort === "desc") items.sort(function (a, b) { return b.price - a.price; });

    document.querySelector("[data-count]").textContent = items.length + " " + LOU.t("shop.found");

    var visible = items.slice(0, state.shown);
    LOU.renderGrid(document.querySelector("[data-grid]"), visible);

    /* Кнопка «Показать ещё» */
    var wrap = document.querySelector("[data-show-more-wrap]");
    var btn = document.querySelector("[data-show-more]");
    if (items.length > state.shown) {
      wrap.style.display = '';
      btn.textContent = LOU.t("shop.showMore");
    } else {
      wrap.style.display = 'none';
    }
  }

  /* ---- События ---- */
  document.querySelector("[data-sort]").addEventListener("change", function () {
    state.sort = this.value;
    state.shown = PAGE_SIZE;
    render();
  });

  document.querySelector("[data-reset]").addEventListener("click", function () {
    dynamicKeys.forEach(function (key) { state[key] = "all"; });
    state.sort = "new";
    state.shown = PAGE_SIZE;
    state._priceMin = 0;
    state._priceMax = Infinity;
    render();
  });

  document.querySelector("[data-show-more]").addEventListener("click", function () {
    state.shown += PAGE_SIZE;
    render();
  });

  document.addEventListener("products:ready", function () {
    state.shown = PAGE_SIZE;
    buildFilterControls();
    render();
  });
  document.addEventListener("lang:change", function () {
    state.shown = PAGE_SIZE;
    buildFilterControls();
    render();
  });
})();
</script>
</body>
</html>
