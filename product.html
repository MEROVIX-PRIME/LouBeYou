<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lou Be You — Product</title>
<meta name="description" content="Lou Be You product details.">
<link rel="icon" href="assets/img/lou-logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="product">
<div data-header></div>
<div class="wrap"><nav class="breadcrumbs breadcrumbs-product" aria-label="Breadcrumb" data-breadcrumbs></nav></div>
<main class="product-page wrap" data-product-page></main>
<div data-footer></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function () {
  var id = new URLSearchParams(location.search).get("id");

  function renderBreadcrumbs(product) {
    var bc = document.querySelector("[data-breadcrumbs]");
    if (!bc) return;
    var tree = window.LOU_CATEGORY_TREE || {};
    var html = '<a href="index.html">' + LOU.t("breadcrumb.home") + '</a><span>›</span>';
    html += '<a href="shop.html">' + LOU.t("breadcrumb.shop") + '</a>';

    if (product) {
      var cat = product.category || "";
      var sub = product.subcategory || "";
      var sub2 = product.subcategory2 || "";

      if (cat && tree[cat]) {
        var catName = LOU.pick(tree[cat].name);
        html += '<span>›</span><a href="shop.html?cat=' + encodeURIComponent(cat) + '">' + catName + '</a>';

        if (sub && tree[cat].children && tree[cat].children[sub]) {
          var subName = LOU.pick(tree[cat].children[sub].name);
          html += '<span>›</span><a href="shop.html?cat=' + encodeURIComponent(cat) + '&sub=' + encodeURIComponent(sub) + '">' + subName + '</a>';

          if (sub2 && tree[cat].children[sub].children && tree[cat].children[sub].children[sub2]) {
            var sub2Name = LOU.pick(tree[cat].children[sub].children[sub2].name);
            html += '<span>›</span><a href="shop.html?cat=' + encodeURIComponent(cat) + '&sub=' + encodeURIComponent(sub) + '&sub2=' + encodeURIComponent(sub2) + '">' + sub2Name + '</a>';
          }
        }
      }
      html += '<span>›</span><span>' + LOU.pick(product.name) + '</span>';
    } else {
      html += '<span>›</span><span>' + LOU.t("breadcrumb.product") + '</span>';
    }
    bc.innerHTML = html;
  }

  function render() {
    if (id && window.LOU) {
      var p = LOU.products.find(function(x) { return x.id === id; });
      renderBreadcrumbs(p);
      LOU.openProduct(id);
    } else {
      renderBreadcrumbs(null);
      document.querySelector("[data-product-page]").innerHTML = '<div class="empty-state"><p>Product not found.</p><a class="btn btn-primary" href="shop.html">Back to shop</a></div>';
    }
  }
  document.addEventListener("products:ready", render);
  document.addEventListener("lang:change", render);
})();
</script>
</body>
</html>
